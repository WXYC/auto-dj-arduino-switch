name: Desktop Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workflow-level GITHUB_TOKEN scope. No job in this file pushes code,
# comments on PRs, or creates releases; all writes to external services
# use their own non-GITHUB_TOKEN secrets. contents:read is the safe floor.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B test/build test/

      - name: Build
        run: cmake --build test/build

      - name: Run tests
        run: cd test/build && ctest --output-on-failure
